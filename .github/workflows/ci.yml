name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The schema applies before anything else runs. If it does not, nothing
      # below is meaningful.
      - name: Apply schema to a scratch database
        run: pnpm db:apply --dry-run

      - run: pnpm check

      # The deploy pipeline, run here rather than discovered on the build host.
      # `pnpm check` type-checks src + test + scripts and emits nothing, so it
      # cannot catch a build whose output lands somewhere `start` does not look.
      - name: Build and verify the start path exists
        run: |
          pnpm build
          test -f dist/server.js || { echo "pnpm build did not produce dist/server.js"; exit 1; }

      # Both mandatory tests run on every commit, by name, so a green build
      # that skipped them is not possible.
      - name: Cross-tenant isolation
        run: pnpm vitest run test/crossTenantIsolation.test.ts

      - name: Module boundary
        run: pnpm vitest run test/moduleBoundary.test.ts

      - run: pnpm test
