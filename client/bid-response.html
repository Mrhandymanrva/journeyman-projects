<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Subcontractor bid response</title><link rel="stylesheet" href="/bid-response.css"></head><body><main><p class="brand">JOURNEYMAN PROJECTS</p><h1 id="title">Bid request</h1><p id="message" role="status">Loading your private request…</p><div id="request" hidden><p id="scope"></p><p id="dates"></p><form id="response"><label>Response<select id="status"><option value="interested">Interested / available</option><option value="quoted">Submit quote</option><option value="declined">Decline</option></select></label><label id="amount-label">Quoted amount<input id="amount" type="number" min="0" step="0.01"></label><label>Available from<input id="available" type="date"></label><label>Quote details, exclusions or questions<textarea id="notes" maxlength="10000" rows="7"></textarea></label><button id="save" type="submit">Submit response</button></form><p class="hint">This link is private to your company. Submitting a quote does not authorize work or create a contract. You can update your response while bidding remains open.</p></div></main><script type="module" src="/bid-response.js"></script></body></html>
